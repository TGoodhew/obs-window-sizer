WindowSizer.Dock.Title="Window Sizer"

WindowSizer.TargetWindow="Target window"
WindowSizer.TargetWindow.Tip="<p>The window to resize and capture.</p><p>This list comes from OBS's own Window Capture source, so it matches that dropdown exactly. Minimised windows are excluded.</p>"

WindowSizer.Refresh="Refresh"
WindowSizer.Refresh.Tip="<p>Rebuild the window list.</p><p>Needed when a window has opened, closed or changed its title since the list was last built.</p>"

WindowSizer.Size="Size"
WindowSizer.Size.Tip="<p>Target size in <b>physical</b> pixels - the units OBS captures in.</p><p>2K means 1440p and 4K means UHD 3840x2160. Pick Custom by simply typing a size below.</p>"

WindowSizer.Width="Width"
WindowSizer.Height="Height"
WindowSizer.Size.Spin.Tip="<p>Physical pixels. A window cannot be made larger than the display it is on, so on a 1440-tall monitor a 2160 height will be refused.</p><p>The status line reports what was actually achieved.</p>"

WindowSizer.Custom="Custom"

WindowSizer.SizeClientArea="Size client area"
WindowSizer.SizeClientArea.Tip="<p><b>On:</b> the content area hits the target size, excluding title bar and borders.</p><p><b>Off:</b> the visible window frame hits it instead, chrome included.</p><p>The capture source is always set to match, so what is sized is what is captured.</p>"

WindowSizer.ConfigureRecording="Record at high fidelity"
WindowSizer.ConfigureRecording.Hint="Rewrites your OBS recording settings for a pixel-exact file. Unchecked leaves them as they are."
WindowSizer.ConfigureRecording.Tip="<p><b>%1</b> at constant quality, with rescaling off so the file is exactly the window size.</p><p>Psycho-visual AQ is off so static UI text stays sharp. Near-lossless, not lossless: OBS records 4:2:0 colour.</p><p>Edits your OBS profile. Does not start a recording.</p>"
WindowSizer.ConfigureRecording.Unavailable="Unavailable: no NVIDIA NVENC encoder is registered on this machine."

WindowSizer.CQ="Quality"
WindowSizer.CQ.Tip="<p>Constant quality level. Lower is better quality and a bigger file.</p><p>16 is visually lossless for UI content; 18-20 is noticeably smaller and still good.</p>"

WindowSizer.Apply="Apply"
WindowSizer.Apply.Tip="<p>Resize the window, match the canvas to it, point the capture source at it and reset its transform.</p><p>Refused while recording or streaming, because the canvas cannot be resized while an output is running. The target window is not touched in that case.</p>"

WindowSizer.Status.Ready="Ready."
WindowSizer.Status.Tip="<p>The result of the last Apply, including the size actually achieved versus the size requested.</p>"

WindowSizer.OutputMode.Title="Switch OBS to Advanced output mode?"
WindowSizer.OutputMode.Text="<p>Your profile uses <b>Simple</b> output mode, which has no constant-quality or preset controls, so recording at high fidelity requires switching it to <b>Advanced</b>.</p><p><b>This also changes where your streaming settings come from.</b> In Advanced mode OBS reads streaming from a different part of the profile, so a bitrate or encoder you tuned in Simple mode will not carry over. Check Settings then Output then Streaming afterwards.</p><p>The switch takes effect after one OBS restart.</p><p>Switch to Advanced and configure recording?</p>"

WindowSizer.Source="Capture source"
WindowSizer.Source.Tip="<p>Which Window Capture source in the current scene to point at the target window.</p><p>With several in a scene you must choose, so that a source you did not pick is never silently repointed.</p>"
WindowSizer.Source.Choose="(choose a source)"
WindowSizer.Source.CreateNew="Create a new capture source"
WindowSizer.Status.ChooseSource="This scene has more than one Window Capture. Choose which one to configure."
WindowSizer.Status.RememberedWindowGone="The window remembered for this scene collection is not open. Choose one, or open it and press Refresh."
